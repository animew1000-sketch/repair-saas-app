<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Client Portal - Account Access</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- TOP HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="text-2xl">🚨</span>
      <span class="font-extrabold text-white text-xl tracking-wider">APEX CLIENT PORTAL</span>
    </div>
    <a href="/app" class="text-xs font-bold text-slate-400 hover:text-white bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">STAFF TERMINAL →</a>
  </header>

  <main class="flex-1 flex flex-col justify-center items-center p-6">
    <div class="max-w-md w-full space-y-6">
      <div class="text-center">
        <h1 class="text-3xl font-extrabold text-white">Create Your Customer Account</h1>
        <p class="text-xs text-slate-400 mt-2">Register with your email and password to place and manage repair work orders.</p>
      </div>

      <!-- TAB SWITCHER -->
      <div class="flex border-b border-slate-800 text-sm font-bold">
        <button id="tab-btn-register" onclick="switchAuthTab('register')" class="flex-1 py-3 text-orange-500 border-b-2 border-orange-500">Create Account</button>
        <button id="tab-btn-login" onclick="switchAuthTab('login')" class="flex-1 py-3 text-slate-400 hover:text-white">Sign In</button>
      </div>

      <!-- CREATE ACCOUNT FORM -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4 shadow-xl">
        <div class="grid grid-cols-2 gap-3">
          <input type="text" id="reg_first_name" required placeholder="First Name" class="input-dark bg-slate-950">
          <input type="text" id="reg_last_name" required placeholder="Last Name" class="input-dark bg-slate-950">
        </div>
        <input type="email" id="reg_email" required placeholder="Email Address" class="input-dark bg-slate-950 w-full">
        <input type="password" id="reg_password" required placeholder="Password" class="input-dark bg-slate-950 w-full">
        <input type="tel" id="reg_phone" required placeholder="Phone Number" class="input-dark bg-slate-950 w-full">

        <button type="submit" class="w-full py-4 bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs uppercase tracking-wider rounded-lg shadow transition">
          CREATE ACCOUNT & CONTINUE TO WORK ORDER
        </button>
      </form>

      <!-- SIGN IN FORM -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="hidden bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4 shadow-xl">
        <input type="email" id="login_email" required placeholder="Email Address" class="input-dark bg-slate-950 w-full">
        <input type="password" id="login_password" required placeholder="Password" class="input-dark bg-slate-950 w-full">

        <button type="submit" class="w-full py-4 bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs uppercase tracking-wider rounded-lg shadow transition">
          SIGN IN & VIEW WORK ORDERS
        </button>
      </form>
    </div>
  </main>

  <script>
    function switchAuthTab(tab) {
      const regForm = document.getElementById('registerForm');
      const loginForm = document.getElementById('loginForm');
      const regBtn = document.getElementById('tab-btn-register');
      const loginBtn = document.getElementById('tab-btn-login');

      if (tab === 'register') {
        regForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        regBtn.className = 'flex-1 py-3 text-orange-500 border-b-2 border-orange-500 font-bold';
        loginBtn.className = 'flex-1 py-3 text-slate-400 hover:text-white font-bold';
      } else {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        loginBtn.className = 'flex-1 py-3 text-orange-500 border-b-2 border-orange-500 font-bold';
        regBtn.className = 'flex-1 py-3 text-slate-400 hover:text-white font-bold';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const payload = {
        company_id: 1,
        first_name: document.getElementById('reg_first_name').value,
        last_name: document.getElementById('reg_last_name').value,
        email: document.getElementById('reg_email').value,
        password: document.getElementById('reg_password').value,
        phone: document.getElementById('reg_phone').value
      };

      try {
        const response = await fetch('/api/client/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('clientUser', JSON.stringify(data.user));
          alert('Account created successfully!');
          window.location.href = '/client-portal';
        } else {
          alert(data.error || 'Registration failed.');
        }
      } catch (err) {
        alert('Server communication error during registration.');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const payload = {
        email: document.getElementById('login_email').value,
        password: document.getElementById('login_password').value
      };

      try {
        const response = await fetch('/api/client/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('clientUser', JSON.stringify(data.user));
          alert('Login successful!');
          window.location.href = '/client-portal';
        } else {
          alert(data.error || 'Invalid credentials.');
        }
      } catch (err) {
        alert('Server communication error during login.');
      }
    }
  </script>
</body>
</html>
